[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-llm-colab-playground"
version = "0.1.0"
description = "Run GGUF language models on free Colab GPUs with llama.cpp hybrid offload."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Free LLM Colab Playground contributors"}]
dependencies = [
  "gradio>=5.20,<7",
  "huggingface-hub>=0.27,<2",
  "psutil>=5.9,<8",
  "requests>=2.31,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
free-llm-playground = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/frontend/ui.py" = ["B008"]
