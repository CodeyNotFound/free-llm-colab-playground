name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, tunnel URLs, tokens, uploaded documents, or private model data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Runtime and hardware
      description: GPU, free VRAM, RAM, model filename, context, and GPU layers. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs

